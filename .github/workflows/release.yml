name: Release

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Generate certs
        run: bash certs/gen.sh

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -ldflags="-s -w" -o "dist/quic-av-server-${GOOS}-${GOARCH}${ext}" ./cmd/server
          go build -ldflags="-s -w" -o "dist/quic-av-publisher-${GOOS}-${GOARCH}${ext}" ./cmd/publisher
          go build -ldflags="-s -w" -o "dist/quic-av-subscriber-${GOOS}-${GOARCH}${ext}" ./cmd/subscriber

      - name: Package
        run: |
          cd dist
          for f in quic-av-server-* quic-av-publisher-* quic-av-subscriber-*; do
            case "$f" in
              *.exe) zip "${f%.exe}.zip" "$f" ;;
              *)     gzip -k "$f" ;;
            esac
          done
          cp ../certs/server.crt ../certs/server.key .
          cp ../scripts/install-service.sh .
          cp ../USAGE.md .
          zip -r quic-av-pubsub-${{ matrix.goos }}-${{ matrix.goarch }}.zip \
            quic-av-server-${{ matrix.goos }}-${{ matrix.goarch }}* \
            quic-av-publisher-${{ matrix.goos }}-${{ matrix.goarch }}* \
            quic-av-subscriber-${{ matrix.goos }}-${{ matrix.goarch }}* \
            server.crt server.key install-service.sh USAGE.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    name: Create Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Release ${{ steps.tag.outputs.version }}
          body: |
            ## QUIC AV Pub/Sub ${{ steps.tag.outputs.version }}

            ### Downloads
            - [Linux amd64](artifacts/release-linux-amd64/quic-av-pubsub-linux-amd64.zip)
            - [Linux arm64](artifacts/release-linux-arm64/quic-av-pubsub-linux-arm64.zip)
            - [macOS amd64](artifacts/release-darwin-amd64/quic-av-pubsub-darwin-amd64.zip)
            - [Windows amd64](artifacts/release-windows-amd64/quic-av-pubsub-windows-amd64.zip)

            ### Changes
            See commit log for details.
          files: |
            artifacts/**/*.zip
          draft: false
          prerelease: false
